# Render Blueprint for the 4OUR Estate API.
# Free web service. The disk is ephemeral, so uploaded photos disappear on redeploy, restart, or spin-down.
# The service spins down after 15 minutes without a request. The next request waits while it starts.
# Free Postgres expires 30 days after creation. Render deletes it 14 days later unless you upgrade it.
# A free web service has no shell and no one-off job. Seed from your machine after the first deploy. See docs/api.md.

services:
  - type: web
    name: 4our-estate-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: 4our-estate-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # CORS_ORIGIN is the Vercel URL of the Next.js app.
      - key: CORS_ORIGIN
        sync: false
      # PUBLIC_API_ORIGIN is the Render service URL. No trailing slash.
      - key: PUBLIC_API_ORIGIN
        sync: false
      - key: NODE_VERSION
        value: "22"
      - key: SWAGGER_ENABLED
        value: "true"

databases:
  - name: 4our-estate-db
    plan: free
